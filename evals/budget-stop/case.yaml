schema_version: "1.1"
name: budget-stop
description: A job over its token budget stops at needs-human before the builder runs.
runs: 1
tags: [live]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Agent, Read, Grep, Glob]
  prompt: "/sdlc:start Add a count() function that returns the number of todos."
