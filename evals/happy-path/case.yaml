schema_version: "1.1"
name: happy-path
description: A small feature goes spec -> build -> verify -> review -> merge on the local host.
runs: 1
tags: [live]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Skill, Agent, Read, Grep, Glob]
  prompt: "/sdlc:start Add complete(todo_id) to mark a todo as done, and let list_todos(done=None) filter by status (None = all). Unknown ids raise KeyError."
